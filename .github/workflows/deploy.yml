name: Build & deploy ke GitHub Pages

on:
  push:
    branches: [main]
  # Commit yang di-push memakai GITHUB_TOKEN sengaja TIDAK memicu workflow lain —
  # itu perlindungan GitHub terhadap loop tak terbatas. Tanpa pemicu ini, cron
  # penyegar data akan rajin mem-commit harga baru sementara situsnya terus
  # menyajikan data lama. `workflow_run` adalah jalan resmi keluar dari situ.
  workflow_run:
    workflows: ['Segarkan data pasar']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy tidak dibatalkan di tengah jalan supaya situs tidak pernah tertinggal
# dalam keadaan setengah terbit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Jangan menerbitkan hasil dari penyegaran data yang gagal di tengah jalan.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Unit test rumus keuangan
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
