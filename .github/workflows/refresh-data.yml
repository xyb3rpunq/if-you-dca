name: Segarkan data pasar

on:
  schedule:
    # Tiap dua jam selama jam bursa IDX (09.00–16.00 WIB) dan AS (20.30–04.00 WIB),
    # sehingga data terjadwal paling basi berumur dua jam, bukan dua belas.
    # Dibatasi dua jam sekali secara sengaja: tiap jalannya menghasilkan satu commit
    # dan satu deploy, dan setiap jam akan membanjiri riwayat repo tanpa manfaat nyata.
    - cron: '0 2,4,6,8 * * 1-5'
    - cron: '0 14,16,18,20 * * 1-5'
    # Sekali di akhir pekan untuk menutup buku harga penutupan Jumat.
    - cron: '0 3 * * 6'
  workflow_dispatch:
    inputs:
      only:
        description: 'Batasi ke aset tertentu (dipisah koma, mis. aapl,spx). Kosongkan untuk semua.'
        required: false
        default: ''

# Job ini menulis balik ke repo, jadi butuh izin tulis. Tidak ada izin lain yang diberikan.
permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ambil harga terbaru dari Yahoo Finance
        run: node scripts/fetch-prices.mjs ${{ inputs.only && format('--only={0}', inputs.only) || '' }}

      - name: Ambil data inflasi dari Bank Dunia
        # Bank Dunia hanya memperbarui setahun sekali, tapi menariknya tiap kali jauh
        # lebih murah daripada mengingat kapan terakhir disegarkan.
        run: node scripts/fetch-inflation.mjs

      - name: Hitung ulang simulasi DCA
        run: node scripts/compute-dca.mjs

      - name: Hitung ATH, support/resistance, dan indikator
        # Butuh dua permintaan per aset (bulanan untuk puncak, harian untuk
        # indikator), jadi langkah ini yang paling lama — tapi tetap di bawah semenit.
        run: node scripts/fetch-technicals.mjs

      - name: Kumpulkan berita per aset
        # Tidak boleh menggagalkan seluruh workflow: berita adalah pelengkap, dan
        # sumber berita jauh lebih sering rewel daripada sumber harga.
        continue-on-error: true
        run: node scripts/fetch-news.mjs

      - name: Ambil rasio fundamental
        # Tanpa secret, script menulis penanda "tidak tersedia" dan tetap sukses —
        # jadi langkah ini aman dijalankan bahkan sebelum API key dipasang.
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/compute-fundamentals.mjs

      - name: Jalankan unit test rumus keuangan
        # Data boleh berubah; rumusnya tidak. Kalau test gagal, jangan commit apa pun.
        run: |
          npm ci
          npm test

      - name: Commit hasilnya kalau memang ada perubahan
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo 'Tidak ada perubahan data — tidak ada commit.'
          else
            git commit -m "data: segarkan harga pasar $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
